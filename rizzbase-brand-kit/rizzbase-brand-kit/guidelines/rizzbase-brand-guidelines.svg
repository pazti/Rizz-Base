<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1940" viewBox="0 0 1600 1940"><style>text{font-family:'Manrope','Avenir Next','Helvetica Neue',Arial,sans-serif}.mono{font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace}</style><rect width="1600" height="1940" fill="#F7F6F3"/><text x="90" y="180" text-anchor="start" fill="#1A1D1C" font-size="100" font-weight="700" letter-spacing="-5.50">Rizzbase<tspan fill="#38BFA2">.</tspan></text><text x="90" y="235" fill="#6F7774" font-size="22">Brand identity quick guide · v1.0</text><path d="M90 300H1510" stroke="#D9DEDB"/><text x="90" y="390" fill="#22957E" font-size="15" class="mono" letter-spacing="2">01 / IDENTITY</text><text x="90" y="490" fill="#1A1D1C" font-size="64" font-weight="600" letter-spacing="-3">One project. One encrypted file.</text><text x="90" y="555" fill="#6F7774" font-size="21">Sharp, technical, and restrained. Trust and clarity come first.</text><rect x="90" y="640" width="680" height="200" fill="#0B0F0E"/><text x="430" y="760" text-anchor="middle" fill="#F4F4F3" font-size="74" font-weight="700" letter-spacing="-4.07">Rizzbase</text><rect x="790" y="640" width="720" height="200" fill="#A5DDD0"/><g transform="translate(1100 690) scale(2.0833333333333335)" fill="none"><path d="M13 8.5h15l7 7V39.5H13V8.5Z" stroke="#1A1D1C" stroke-width="2.4" stroke-linejoin="round"/><path d="M28 8.5v7h7" stroke="#1A1D1C" stroke-width="2.4" stroke-linejoin="round"/><path d="M18.5 29.5h11" stroke="#38BFA2" stroke-width="2.4" stroke-linecap="round"/><circle cx="18.5" cy="23" r="1.8" fill="#38BFA2"/></g><text x="90" y="910" fill="#22957E" font-size="15" class="mono" letter-spacing="2">02 / COLOR</text><rect x="90" y="950" width="420" height="105" fill="#0B0F0E" stroke="#D9DEDB"/><text x="90" y="1087" fill="#1A1D1C" font-size="16" font-weight="600">Core dark</text><text x="510" y="1087" text-anchor="end" fill="#6F7774" font-size="14" class="mono">#0B0F0E</text><rect x="560" y="950" width="420" height="105" fill="#F7F6F3" stroke="#D9DEDB"/><text x="560" y="1087" fill="#1A1D1C" font-size="16" font-weight="600">Warm light</text><text x="980" y="1087" text-anchor="end" fill="#6F7774" font-size="14" class="mono">#F7F6F3</text><rect x="1030" y="950" width="420" height="105" fill="#38BFA2" stroke="#D9DEDB"/><text x="1030" y="1087" fill="#1A1D1C" font-size="16" font-weight="600">Rizz teal</text><text x="1450" y="1087" text-anchor="end" fill="#6F7774" font-size="14" class="mono">#38BFA2</text><rect x="90" y="1140" width="420" height="105" fill="#22957E" stroke="#D9DEDB"/><text x="90" y="1277" fill="#1A1D1C" font-size="16" font-weight="600">Teal active</text><text x="510" y="1277" text-anchor="end" fill="#6F7774" font-size="14" class="mono">#22957E</text><rect x="560" y="1140" width="420" height="105" fill="#A5DDD0" stroke="#D9DEDB"/><text x="560" y="1277" fill="#1A1D1C" font-size="16" font-weight="600">Teal muted</text><text x="980" y="1277" text-anchor="end" fill="#6F7774" font-size="14" class="mono">#A5DDD0</text><rect x="1030" y="1140" width="420" height="105" fill="#6F7774" stroke="#D9DEDB"/><text x="1030" y="1277" fill="#1A1D1C" font-size="16" font-weight="600">Muted text</text><text x="1450" y="1277" text-anchor="end" fill="#6F7774" font-size="14" class="mono">#6F7774</text><text x="90" y="1380" fill="#22957E" font-size="15" class="mono" letter-spacing="2">03 / TYPE</text><text x="90" y="1470" fill="#1A1D1C" font-size="58" font-weight="600" letter-spacing="-2">Your data stays yours.</text><text x="90" y="1535" fill="#1A1D1C" font-size="36" font-weight="600">Local-first by design.</text><text x="90" y="1585" fill="#6F7774" font-size="19">Manrope display · Inter body · IBM Plex Mono code only</text><text x="820" y="1380" fill="#22957E" font-size="15" class="mono" letter-spacing="2">04 / USAGE</text><text x="820" y="1460" fill="#1A1D1C" font-size="18">— Use generous clear space</text><text x="820" y="1500" fill="#1A1D1C" font-size="18">— Use monochrome first</text><text x="820" y="1540" fill="#1A1D1C" font-size="18">— Reserve teal for action</text><text x="820" y="1620" fill="#9B4945" font-size="18">— No neon or purple gradients</text><text x="820" y="1660" fill="#9B4945" font-size="18">— Do not stretch the wordmark</text><text x="820" y="1700" fill="#9B4945" font-size="18">— No memes or lock clichés</text><path d="M90 1810H1510" stroke="#D9DEDB"/><text x="90" y="1860" fill="#6F7774" font-size="15">Clear space = cap height of R · Minimum wordmark width = 96 px · Use mark below 96 px</text><text x="1510" y="1860" text-anchor="end" fill="#6F7774" font-size="13" class="mono">RIZZBASE / BRAND KIT / 2025</text></svg>