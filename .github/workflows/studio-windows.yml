name: Rizzbase Studio Windows Installer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/studio-windows.yml"
      - "engine/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "public/**"
      - "rizzbase-brand-kit/**"
      - "src/**"
      - "studio/**"
      - "vite.config.ts"
  workflow_dispatch:
    inputs:
      identityName:
        description: Package identity name from Partner Center (leave empty for a test identity)
        required: false
        type: string
      publisher:
        description: Publisher from Partner Center (leave empty for a test identity)
        required: false
        type: string
      publisherDisplayName:
        description: Publisher display name from Partner Center (leave empty for a test identity)
        required: false
        type: string
      version:
        description: Four-part Store package version ending in .0
        required: false
        default: "1.0.0.0"
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: studio/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install NSIS
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
          }
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          if (Test-Path (Join-Path $nsisPath "makensis.exe")) {
            $env:PATH = "$nsisPath;$env:PATH"
          }
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            throw "NSIS was not found after installation."
          }
          (Split-Path (Get-Command makensis.exe).Source) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          "$(Join-Path (go env GOPATH) 'bin')" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build Windows installer
        working-directory: studio
        run: wails build -platform windows/amd64 -nsis -webview2 download

      - name: Verify Windows app branding
        shell: pwsh
        run: |
          $brandHash = (Get-FileHash "public/favicon-512.png" -Algorithm SHA256).Hash
          $appIconHash = (Get-FileHash "studio/build/appicon.png" -Algorithm SHA256).Hash
          if ($brandHash -ne $appIconHash) {
            throw "The Wails application icon does not match the official Rizzbase brand mark."
          }

          $iconPath = "studio/build/windows/icon.ico"
          if (-not (Test-Path $iconPath)) {
            throw "Wails did not generate the Windows application icon."
          }
          $iconBytes = [System.IO.File]::ReadAllBytes((Resolve-Path $iconPath))
          $iconCount = [BitConverter]::ToUInt16($iconBytes, 4)
          if ($iconCount -lt 6) {
            throw "The Windows application icon is missing its multi-size icon variants."
          }

          $executable = "studio/build/bin/Rizzbase Studio.exe"
          $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $executable))
          $expectedMetadata = @{
            CompanyName = "Rizzbase"
            ProductName = "Rizzbase Studio"
            ProductVersion = "1.0.0.0"
          }
          foreach ($property in $expectedMetadata.Keys) {
            if ($versionInfo.$property -ne $expectedMetadata[$property]) {
              throw "Windows executable $property is '$($versionInfo.$property)' instead of '$($expectedMetadata[$property])'."
            }
          }

      - name: Package Microsoft Store MSIX
        env:
          STORE_IDENTITY_NAME: ${{ github.event.inputs.identityName }}
          STORE_PUBLISHER: ${{ github.event.inputs.publisher }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ github.event.inputs.publisherDisplayName }}
          STORE_VERSION: ${{ github.event.inputs.version }}
        shell: pwsh
        run: |
          $identity = $env:STORE_IDENTITY_NAME
          $publisher = $env:STORE_PUBLISHER
          $publisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME
          $hasIdentity = -not [string]::IsNullOrWhiteSpace($identity)
          $hasPublisher = -not [string]::IsNullOrWhiteSpace($publisher)
          if ($hasIdentity -ne $hasPublisher) {
            throw "Supply both Partner Center identity and publisher, or leave both empty for the test package."
          }
          if (-not $hasIdentity) {
            $identity = "RizzbaseStudio.LocalTest"
            $publisher = "CN=Rizzbase Studio Local Test"
            $publisherDisplayName = "Rizzbase Studio Local Test"
          } elseif ([string]::IsNullOrWhiteSpace($publisherDisplayName)) {
            throw "Supply the Partner Center publisher display name when building a Store package."
          }
          $version = $env:STORE_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "1.0.0.0"
          }
          pwsh -NoProfile -File studio/store/package-msix.ps1 `
            -ExecutablePath "studio/build/bin/Rizzbase Studio.exe" `
            -OutputPath "studio/build/bin/RizzbaseStudio.msix" `
            -IdentityName $identity `
            -Publisher $publisher `
            -PublisherDisplayName $publisherDisplayName `
            -Version $version

      - name: Install and launch on clean Windows runner
        shell: pwsh
        run: |
          $installer = Get-ChildItem "studio/build/bin" -File -Filter "*installer*.exe" | Select-Object -First 1
          if (-not $installer) {
            Get-ChildItem "studio/build/bin"
            throw "Wails did not produce an NSIS installer."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "Rizzbase Studio"
          $installResult = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($installResult.ExitCode -ne 0) {
            throw "Silent installer exited with code $($installResult.ExitCode)."
          }

          $app = Join-Path $installDir "Rizzbase Studio.exe"
          if (-not (Test-Path $app)) {
            throw "Installed application was not found at $app."
          }

          $process = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) {
            throw "Rizzbase Studio exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Sign MSIX package for local validation
        timeout-minutes: 2
        env:
          STORE_IDENTITY_NAME: ${{ github.event.inputs.identityName }}
          STORE_PUBLISHER: ${{ github.event.inputs.publisher }}
        shell: pwsh
        run: |
          $identity = $env:STORE_IDENTITY_NAME
          $publisher = $env:STORE_PUBLISHER
          $hasIdentity = -not [string]::IsNullOrWhiteSpace($identity)
          $hasPublisher = -not [string]::IsNullOrWhiteSpace($publisher)
          if ($hasIdentity -ne $hasPublisher) {
            throw "Supply both Partner Center identity and publisher, or leave both empty for the test package."
          }
          if (-not $hasIdentity) {
            $identity = "RizzbaseStudio.LocalTest"
            $publisher = "CN=Rizzbase Studio Local Test"
          }

          $packagePath = (Resolve-Path "studio/build/bin/RizzbaseStudio.msix").Path
          $signedPackage = Join-Path $env:RUNNER_TEMP "RizzbaseStudio-test.msix"
          Copy-Item $packagePath $signedPackage -Force

          $sdkBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signtoolCommand = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($signtoolCommand) {
            $signtoolPath = $signtoolCommand.Source
          } else {
            $signtoolPath = Get-ChildItem $sdkBin -Directory |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }
          if (-not $signtoolPath) {
            throw "signtool.exe was not found in the Windows SDK."
          }

          Write-Host "Using signtool at $signtoolPath."
          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject $publisher `
            -CertStoreLocation "Cert:\CurrentUser\My"
          $certificateFile = Join-Path $env:RUNNER_TEMP "RizzbaseStudio-test.cer"
          Export-Certificate -Cert $certificate -FilePath $certificateFile | Out-Null
          Import-Certificate -FilePath $certificateFile -CertStoreLocation "Cert:\CurrentUser\TrustedPeople" | Out-Null
          Import-Certificate -FilePath $certificateFile -CertStoreLocation "Cert:\CurrentUser\Root" | Out-Null

          & $signtoolPath sign /fd SHA256 /s My /sha1 $certificate.Thumbprint $signedPackage
          if ($LASTEXITCODE -ne 0) {
            throw "MSIX signing failed with exit code $LASTEXITCODE."
          }

      - name: Run Windows App Certification Kit
        timeout-minutes: 20
        shell: pwsh
        run: |
          $appcert = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appcert)) {
            throw "Windows App Certification Kit was not found at $appcert."
          }
          $signedPackage = Join-Path $env:RUNNER_TEMP "RizzbaseStudio-test.msix"
          $report = Join-Path $env:RUNNER_TEMP "RizzbaseStudio-WACK.xml"

          & $appcert reset
          if ($LASTEXITCODE -ne 0) {
            throw "Windows App Certification Kit could not reset its test state."
          }
          & $appcert test -appxpackagepath $signedPackage -reportoutputpath $report
          if ($LASTEXITCODE -ne 0) {
            throw "Windows App Certification Kit reported package validation failures."
          }
          if (-not (Test-Path $report)) {
            throw "Windows App Certification Kit completed without creating its report."
          }

      - name: Upload Windows App Certification Kit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rizzbase-studio-wack-report
          path: ${{ runner.temp }}/RizzbaseStudio-WACK*
          if-no-files-found: warn
          retention-days: 7

      - name: Install signed MSIX package
        timeout-minutes: 5
        env:
          STORE_IDENTITY_NAME: ${{ github.event.inputs.identityName }}
        shell: pwsh
        run: |
          $identity = $env:STORE_IDENTITY_NAME
          if ([string]::IsNullOrWhiteSpace($identity)) {
            $identity = "RizzbaseStudio.LocalTest"
          }
          $signedPackage = Join-Path $env:RUNNER_TEMP "RizzbaseStudio-test.msix"
          if (-not (Test-Path $signedPackage)) {
            throw "The signed validation package was not created."
          }

          Write-Host "Installing signed MSIX package."
          $existingPackage = Get-AppxPackage -Name $identity
          if ($existingPackage) {
            Remove-AppxPackage -Package $existingPackage.PackageFullName
          }
          Add-AppxPackage -Path $signedPackage
          $package = Get-AppxPackage -Name $identity
          if (-not $package) {
            throw "The MSIX package was not installed."
          }
          Write-Host "Installed package $($package.PackageFullName)."
          "STORE_PACKAGE_IDENTITY=$identity" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Launch installed MSIX app
        timeout-minutes: 2
        shell: pwsh
        run: |
          $package = Get-AppxPackage -Name $env:STORE_PACKAGE_IDENTITY
          if (-not $package) {
            throw "The installed MSIX package could not be found."
          }

          $aumid = "$($package.PackageFamilyName)!RizzbaseStudio"
          Write-Host "Launching packaged app $aumid."
          Start-Process explorer.exe -ArgumentList "shell:AppsFolder\$aumid"
          Start-Sleep -Seconds 10
          $process = Get-Process -Name "Rizzbase Studio" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $process) {
            throw "Rizzbase Studio did not launch from the MSIX package."
          }
          Stop-Process -Id $process.Id -Force

      - name: Remove installed MSIX app
        timeout-minutes: 2
        shell: pwsh
        run: |
          $identity = $env:STORE_PACKAGE_IDENTITY
          $package = Get-AppxPackage -Name $identity
          if (-not $package) {
            throw "The installed MSIX package could not be found for removal."
          }
          Write-Host "Removing installed test package."
          Remove-AppxPackage -Package $package.PackageFullName
          if (Get-AppxPackage -Name $identity) {
            throw "The test MSIX package did not uninstall."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: rizzbase-studio-windows
          path: |
            studio/build/bin/*.exe
            studio/build/bin/*.msix
            ${{ runner.temp }}/RizzbaseStudio-WACK.xml
          if-no-files-found: error
          retention-days: 7
