name: Release Go engine binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: windows
            goarch: arm64
            suffix: .exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: engine/go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ENGINE_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p ../generated-artifacts
          ENGINE_VERSION="${ENGINE_VERSION#v}"
          if [[ ! "$ENGINE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must contain a stable semver engine version." >&2
            exit 1
          fi
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid= -X main.version=${ENGINE_VERSION}" \
            -o "../generated-artifacts/rizzbase-${GOOS}-${GOARCH}${{ matrix.suffix }}" ./cmd/rizzbase
        working-directory: engine
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rizzbase-${{ matrix.goos }}-${{ matrix.goarch }}
          path: generated-artifacts/*
          if-no-files-found: error
          retention-days: 1

  reproduce:
    needs: build
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: windows
            goarch: arm64
            suffix: .exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: engine/go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rizzbase-${{ matrix.goos }}-${{ matrix.goarch }}
          path: engine/generated-artifacts
      - name: Rebuild and compare
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ENGINE_VERSION: ${{ github.ref_name }}
        run: |
          ENGINE_VERSION="${ENGINE_VERSION#v}"
          if [[ ! "$ENGINE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must contain a stable semver engine version." >&2
            exit 1
          fi
          expected="generated-artifacts/rizzbase-${GOOS}-${GOARCH}${{ matrix.suffix }}"
          actual="$(mktemp)"
          trap 'rm -f "$actual"' EXIT
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid= -X main.version=${ENGINE_VERSION}" \
            -o "$actual" ./cmd/rizzbase
          if ! cmp --silent "$expected" "$actual"; then
            echo "Reproducible build mismatch for ${GOOS}/${GOARCH}." >&2
            sha256sum "$expected" "$actual" >&2
            exit 1
          fi
        working-directory: engine

  publish-release:
    needs:
      - build
      - reproduce
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: generated-artifacts
          merge-multiple: true
      - name: Create SHA-256 manifest
        run: cd generated-artifacts && sha256sum rizzbase-* > SHA256SUMS
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
      - name: Sign SHA-256 manifest
        run: cosign sign-blob --yes --bundle generated-artifacts/SHA256SUMS.sigstore.json generated-artifacts/SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: generated-artifacts/*
