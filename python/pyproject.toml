[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rizzbase"
version = "1.1.0"
description = "Local-first encrypted Projects, Lobbies and Yaps for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Database",
	"Topic :: Security :: Cryptography",
]
keywords = ["encrypted", "local-first", "database", "sdk"]

[project.urls]
Homepage = "https://github.com/pazti/Rizz-Base"
Documentation = "https://github.com/pazti/Rizz-Base/tree/main/python"
Repository = "https://github.com/pazti/Rizz-Base"
Issues = "https://github.com/pazti/Rizz-Base/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
